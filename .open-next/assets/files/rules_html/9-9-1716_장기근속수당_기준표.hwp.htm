		var adjustStyle = function(borderWidth) {

 				width = 0.03;
 			}
 		} else if (unit == 'in') {
 			if (width > 0.0 && width < 0.02) {
 				width = 0.02;
 			}
 		} else if (unit == 'mm') {
 			if (width > 0.0 && width < 0.3) {
 				width = 0.3;
 			}
 		} else if (unit == 'pc') {
 			if (width > 0.0 && width < 0.07) {

 			if (width > 0.0 && width < 1.0) {

 			}
 		} else if (unit == 'pt') {
