<!DOCTYPE html>
<html>
<head>
<style>
  .w-full { width: 100%; }
  .inline-block { display: inline-block; }
  .flex-1 { flex: 1 1 0%; }
  .group { }
  .text-slate-800 { color: #1e293b; }
  .break-keep { word-break: keep-all; }
  .inline { display: inline; }
  .font-normal { font-weight: 400; }
  .mr-1 { margin-right: 0.25rem; }
  .py-0 { padding-top: 0; padding-bottom: 0; }
</style>
</head>
<body>
  <div class="flex-1 w-full group text-[16px] text-slate-800 leading-[1.7]">
    <div class="w-full break-keep inline-block">
      <span class="font-bold mr-1 text-[#000080]">제25조(임원의 겸직금지)</span>
      <span class="font-normal">
        <span class="font-normal text-slate-800 break-keep inline">
          <span class="mr-1">①</span>
          이사장은 당해 학교법인이 설치.경영하는 사립학교의 장을 겸할 수 없다. 
          <span class="text-sky-700 font-medium text-[13px] ml-1">&lt;개정 2008. 7. 16.&gt;</span>
        </span>
        <div class="w-full break-keep text-slate-800 py-0.5" style="padding-left: 20px; text-indent: -20px;">
          <span class="font-normal mr-1">②</span>
          <span class="font-normal">이사는 감사 또는 당해 학교법인이 설치.경영하는 학교의 교원 기타 직원을 겸할 수 없다. 다만, 학교의 장은 예외로 한다. </span>
        </div>
      </span>
    </div>
  </div>
</body>
</html>
