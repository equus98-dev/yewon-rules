<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; font-size: 14.5px; width: 600px; margin: 40px; }
  .hanging {
    padding-left: 20px;
    text-indent: -20px;
    margin-bottom: 6px;
    line-height: 1.7;
  }
</style>
</head>
<body>
  <div class="hanging">
    <b>제6조(자산의 구분)</b> ① 이 법인의 자산은 기본재산과 보통재산으로 구분하되 기본재산은 교육용 기본재산과 수익용 기본재산으로 구분하여 관리한다.
  </div>
  <div class="hanging">
    ② 기본재산은 별지 목록의 재산과 제11조의 규정에 의한 적립금 및 기타 이사회의 의결에 의하여 기본재산으로 정하는 재산으로 한다.
  </div>
  <div class="hanging">
    ③ 보통재산은 제2항에서 정하는 기본재산 이외의 재산으로 한다.
  </div>
</body>
</html>
