<!DOCTYPE html>
<html>
<head>
<style>
.inline-block { display: inline-block; width: 100%; }
.font-bold { font-weight: bold; }
.ml-1 { margin-left: 0.25rem; }
.mr-1 { margin-right: 0.25rem; }
.block { display: block; padding-left: 20px; text-indent: -20px; }
.inline { display: inline; }
.w-full { width: 100%; }
.break-keep { word-break: keep-all; }
.text-slate-800 { color: #1e293b; }
.font-normal { font-weight: normal; }
</style>
</head>
<body>
<div class="w-full break-keep inline-block" style="border: 1px solid red;">
   <span class="font-bold text-[#000080]">제71조</span>
   <span class="font-normal text-slate-800 ml-1 mr-1">(학부(과)장)</span>
   
     <span class="font-normal text-slate-800 break-keep inline">
       <span class="mr-1">①</span>
       대학교의 각 학부(과)에 학부(과)장을 둔다.
     </span>
     <div class="block w-full break-keep text-slate-800 py-0.5">
       <span class="font-normal mr-1">②</span>
       학부(과)장은 총장의 명을 받아 각 학부(과)의 교무를 총괄하며 학생을 지도한다.
     </div>
   
</div>
</body>
</html>
